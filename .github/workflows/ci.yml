name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node $ {{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: $ {{ matrix.node }}

      - name: 语法检查
        run: npm run check

      - name: 单元测试
        run: npm test
